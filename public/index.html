<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff8a65">
<title>武内製作所 社内トーク</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 名前選択モーダル -->
<div id="loginOverlay" class="overlay">
  <div class="login-card">
    <div class="login-emoji">🏭</div>
    <h1>武内製作所<br>社内トーク</h1>
    <p class="login-sub">あなたのお名前を選んでね👇</p>
    <div id="memberGrid" class="member-grid"></div>
  </div>
</div>

<div id="app" class="app hidden">

  <header class="app-header">
    <div class="header-left">
      <span class="logo">🏭</span>
      <div>
        <h1>武内製作所 社内トーク</h1>
        <p class="header-sub" id="whoami"></p>
      </div>
    </div>
    <div class="header-right">
      <button id="notifyBtn" class="pill-btn" title="プッシュ通知を有効にする">🔔 通知OFF</button>
      <button id="switchUserBtn" class="pill-btn ghost" title="ユーザーを切り替える">🔁</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="timeline">💬 タイムライン</button>
    <button class="tab-btn" data-tab="board">📌 連絡事項</button>
    <button class="tab-btn" data-tab="photos">📷 みんなの写真</button>
  </nav>

  <main class="main">
    <section id="timeline" class="tab-panel active">
      <div id="feed" class="feed"></div>
    </section>

    <section id="board" class="tab-panel">
      <div id="boardFeed" class="feed"></div>
    </section>

    <section id="photos" class="tab-panel">
      <div id="photoGrid" class="photo-grid"></div>
    </section>
  </main>

  <form id="composer" class="composer">
    <div id="photoPreviewWrap" class="photo-preview-wrap hidden">
      <img id="photoPreview" alt="プレビュー">
      <button type="button" id="removePhotoBtn" class="remove-photo">✕</button>
      <label class="private-toggle">
        <input type="checkbox" id="privateCheck">
        <span>😄 プライベート投稿にする（会社の話題じゃない写真だよ、と分かる目印）</span>
      </label>
    </div>
    <div class="composer-row">
      <label class="icon-btn" title="写真を添付">
        📷
        <input type="file" id="photoInput" accept="image/*" hidden>
      </label>
      <textarea id="textInput" rows="1" placeholder="メッセージを入力...（Shift+Enterで改行）"></textarea>
      <label class="announce-toggle" title="連絡事項として送ると全員にプッシュ通知が届きます">
        <input type="checkbox" id="announceCheck">
        <span>📢 連絡事項</span>
      </label>
      <button type="submit" class="send-btn">送信</button>
    </div>
  </form>
</div>

<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
